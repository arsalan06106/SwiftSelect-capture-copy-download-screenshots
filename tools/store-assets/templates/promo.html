<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(../../../fonts/inter-latin.woff2) format("woff2");font-weight:100 900}
*{box-sizing:border-box;margin:0}
html,body{width:var(--w);height:var(--h);overflow:hidden}
body{font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased;color:#f4f5f8;position:relative;
 background:radial-gradient(60% 90% at -5% -10%,rgba(232,72,104,.30),transparent 60%),radial-gradient(60% 90% at 105% 110%,rgba(38,198,190,.22),transparent 60%),radial-gradient(50% 70% at 75% -20%,rgba(110,92,255,.20),transparent 60%),#0c0d12}
body::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:22px 22px;pointer-events:none;mask-image:linear-gradient(90deg,#000,transparent 70%)}
.acc{background:linear-gradient(90deg,#ff6b8b,#ffa36b);-webkit-background-clip:text;color:transparent}
.crop{position:absolute;overflow:hidden}
.crop img{position:absolute;display:block}
.shadow{filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
/* small */
.s .brand{position:absolute;left:28px;top:28px;display:flex;align-items:center;gap:12px}
.s .brand img{width:46px}
.s .brand b{font-size:31px;letter-spacing:-.03em;font-weight:740}
.s .tag{position:absolute;left:30px;top:94px;font-size:19px;line-height:1.3;font-weight:600;letter-spacing:-.015em;color:#e7e9ef}
/* marquee */
.m .left{position:absolute;left:84px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center;z-index:3}
.m .brand{display:flex;align-items:center;gap:18px}
.m .brand img{width:80px}
.m .brand b{font-size:62px;letter-spacing:-.04em;font-weight:740}
.m h2{font-size:34px;line-height:1.18;letter-spacing:-.025em;font-weight:600;margin-top:30px;color:#eceef3}
.m ul{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.m li{font-size:15px;font-weight:600;color:#cfd3dd;padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.win{position:absolute;border-radius:16px;overflow:hidden;background:#17181e;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 40px 90px -20px rgba(0,0,0,.85),0 0 140px -30px rgba(70,200,190,.4)}
.bar{height:34px;display:flex;align-items:center;gap:7px;padding:0 14px;background:linear-gradient(#1e2027,#191a20)}
.bar i{width:10px;height:10px;border-radius:50%;background:#3a3c45}
.win>img{display:block}
.pop{position:absolute;border-radius:20px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.18),0 40px 70px -16px rgba(0,0,0,.8)}
.pop img{display:block}
</style></head><body><div id="root"></div>
<script>
const k=location.hash.slice(1), R=document.getElementById('root');
// toolbar crop from raw-region.png (2240x1240): pill spans x 912..2196, y 44..212
const toolbar=(scale,left,top)=>{const x0=900,y0=34,w=1310,h=190;return `<div class="crop shadow" style="left:${left}px;top:${top}px;width:${w*scale}px;height:${h*scale}px"><img src="../out/raw-region.png" style="width:${2240*scale}px;left:${-x0*scale}px;top:${-y0*scale}px"></div>`};
if(k==='small'){document.body.className='s';R.innerHTML=`<div class="brand"><img src="../../../icons/app128.png"><b>SwiftSelect</b></div>
<div class="tag">Capture, copy &amp; download<br><span class="acc">screenshots in one motion</span></div><img src="../out/raw-toolbar.png" style="position:absolute;left:4px;top:166px;width:432px">`;}
if(k==='marquee'){document.body.className='m';R.innerHTML=`<div class="left"><div class="brand"><img src="../../../icons/app128.png"><b>SwiftSelect</b></div>
<h2>Capture, copy and download<br>screenshots <span class="acc">in one motion</span></h2>
<ul><li>Region</li><li>Full page</li><li>Annotate</li><li>Gallery</li><li>Converter</li></ul></div>
<div class="win" style="left:700px;top:56px;width:820px"><div class="bar"><i></i><i></i><i></i></div><img src="../out/raw-panel-gallery.png" style="width:1120px;margin-left:-250px"></div>
<div class="pop" style="left:610px;top:112px;width:250px"><img src="../out/raw-popup.png" style="width:250px"></div>`;}
</script></body></html>

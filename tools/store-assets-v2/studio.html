<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SwiftSelect — Chrome Web Store Assets v2 Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
@font-face {
  font-family: "SS Inter";
  src: url("/fonts/inter-latin.woff2") format("woff2");
  font-weight: 100 900;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --display: "Plus Jakarta Sans", "SS Inter", system-ui, sans-serif;
  --body: "DM Sans", "SS Inter", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  --ink: #11131a;
  --ink-2: #4b5063;
  --ink-3: #7c8296;
  --coral: #f43f5e;
  --coral-deep: #e11d48;
  --aqua: #06b6d4;
  --cobalt: #2563eb;
  --violet: #7c3aed;
  --emerald: #059669;
  --paper: #f6f7fb;
  --obsidian: #0c0e15;
  --obsidian-2: #151824;
  --reflex-light:
    inset 0 0 0 1px rgba(255,255,255,0.72),
    inset 1.5px 2.5px 0 -1px rgba(255,255,255,0.92),
    inset -1.5px -1.5px 0 -1px rgba(255,255,255,0.68),
    inset 0 3px 6px -2px rgba(15,23,42,0.08),
    0 2px 6px rgba(15,23,42,0.08),
    0 22px 48px -14px rgba(15,23,42,0.20);
  --reflex-dark:
    inset 0 0 0 1px rgba(255,255,255,0.14),
    inset 1px 2px 0 -1px rgba(255,255,255,0.22),
    inset -1px -1px 0 -1px rgba(255,255,255,0.08),
    0 24px 56px -14px rgba(0,0,0,0.62);
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: var(--body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: geometricPrecision;
}

#stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

/* ─── SHARED BRAND & STUDIO PRIMITIVES ───────────────────────────────────── */

.studio-light {
  background:
    radial-gradient(65% 75% at 4% 2%, rgba(244, 63, 94, 0.085), transparent 64%),
    radial-gradient(62% 72% at 96% 94%, rgba(6, 182, 212, 0.115), transparent 62%),
    radial-gradient(48% 54% at 88% 8%, rgba(99, 102, 241, 0.07), transparent 65%),
    #f6f7fb;
  color: var(--ink);
}

.studio-mist {
  background:
    radial-gradient(58% 68% at 10% 95%, rgba(244, 63, 94, 0.075), transparent 62%),
    radial-gradient(58% 68% at 94% 12%, rgba(56, 189, 248, 0.10), transparent 62%),
    #f1f3f8;
  color: var(--ink);
}

.studio-dark {
  background:
    radial-gradient(58% 66% at 8% 4%, rgba(244, 63, 94, 0.16), transparent 62%),
    radial-gradient(55% 68% at 95% 96%, rgba(6, 182, 212, 0.17), transparent 60%),
    radial-gradient(48% 54% at 74% 10%, rgba(99, 102, 241, 0.12), transparent 64%),
    #0b0d14;
  color: #f4f6fb;
}

.optical-ribbon {
  position: absolute;
  pointer-events: none;
  object-fit: cover;
  user-select: none;
}

.kicker {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--body);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: var(--ink-2);
}
.studio-dark .kicker { color: #a5acc2; }
.kicker img { width: 22px; height: 22px; display: block; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.14)); }
.kicker .sep { opacity: 0.42; font-weight: 400; }

.h-display {
  font-family: var(--display);
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1.04;
  text-wrap: balance;
}

.accent-coral { color: var(--coral-deep); }
.studio-dark .accent-coral { color: #ff647d; }
.accent-aqua { color: #0891b2; }
.studio-dark .accent-aqua { color: #38e2f5; }

.lead {
  font-size: 16px;
  line-height: 1.56;
  color: var(--ink-2);
  font-weight: 400;
}
.studio-dark .lead { color: #9ea5bc; }

.kbd-pair {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  vertical-align: middle;
}
.kbd {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 26px;
  padding: 0 8px;
  border-radius: 7px;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
  background: linear-gradient(180deg, #ffffff 0%, #eef0f6 100%);
  border: 1px solid rgba(17, 19, 26, 0.14);
  box-shadow: 0 2px 0 rgba(17, 19, 26, 0.12), inset 0 1px 0 #fff;
}
.studio-dark .kbd {
  color: #f4f6fb;
  background: linear-gradient(180deg, #252938 0%, #191c28 100%);
  border-color: rgba(255,255,255,0.16);
  box-shadow: 0 2px 0 rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.12);
}

/* ─── BROWSER CHROME FRAME ───────────────────────────────────────────────── */
.chrome-frame {
  border-radius: 18px;
  overflow: hidden;
  background: #ffffff;
  box-shadow:
    0 0 0 1px rgba(17, 19, 26, 0.09),
    0 32px 72px -18px rgba(15, 23, 42, 0.24),
    0 8px 20px -6px rgba(15, 23, 42, 0.10);
}
.studio-dark .chrome-frame {
  background: #141722;
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.11),
    0 36px 84px -18px rgba(0, 0, 0, 0.78),
    0 0 120px -30px rgba(56, 226, 245, 0.14);
}
.chrome-bar {
  height: 38px;
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 8px;
  background: linear-gradient(180deg, #f9fafc 0%, #f1f3f8 100%);
  border-bottom: 1px solid rgba(17, 19, 26, 0.07);
  position: relative;
}
.studio-dark .chrome-bar,
.chrome-frame.dark-chrome .chrome-bar {
  background: linear-gradient(180deg, #1d202d 0%, #171924 100%);
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
}
.chrome-dots { display: flex; gap: 7px; align-items: center; }
.chrome-dots i { width: 10px; height: 10px; border-radius: 50%; display: block; }
.chrome-dots i:nth-child(1) { background: #ff5f57; }
.chrome-dots i:nth-child(2) { background: #febc2e; }
.chrome-dots i:nth-child(3) { background: #28c840; }

.chrome-url {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  height: 24px;
  min-width: 280px;
  padding: 0 16px;
  border-radius: 7px;
  background: rgba(17, 19, 26, 0.05);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-size: 12px;
  font-weight: 500;
  color: #5b6175;
}
.studio-dark .chrome-url,
.chrome-frame.dark-chrome .chrome-url {
  background: rgba(0, 0, 0, 0.34);
  color: #9ba3bc;
}
.chrome-ext {
  margin-left: auto;
  width: 24px;
  height: 24px;
  border-radius: 7px;
  background: rgba(17, 19, 26, 0.05);
  display: grid;
  place-items: center;
}
.studio-dark .chrome-ext,
.chrome-frame.dark-chrome .chrome-ext { background: rgba(255,255,255,0.08); }
.chrome-ext img { width: 15px; height: 15px; display: block; }

/* ─── AUTHENTIC LIQUID GLASS CAPTURE TOOLBAR ─────────────────────────────── */
.lg-toolbar {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 999px;
  background: rgba(248, 250, 255, 0.72);
  backdrop-filter: blur(22px) saturate(185%);
  -webkit-backdrop-filter: blur(22px) saturate(185%);
  box-shadow: var(--reflex-light);
}
.lg-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 38px;
  padding: 0 14px 0 7px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.86);
  box-shadow:
    inset 0 1px 0 #fff,
    inset 0 0 0 1px rgba(17, 19, 26, 0.06),
    0 2px 6px rgba(15, 23, 42, 0.08);
  font-family: var(--body);
  font-size: 13px;
  font-weight: 600;
  color: #161822;
  white-space: nowrap;
}
.lg-btn.icon-only {
  width: 38px;
  padding: 0;
  justify-content: center;
}
.lg-tile {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #fff;
  flex-shrink: 0;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 3px 8px -2px var(--sh, rgba(0,0,0,0.3));
}
.t-cyan { background: linear-gradient(160deg, #38bdf8, #0284c7); --sh: rgba(2,132,199,0.5); }
.t-violet { background: linear-gradient(160deg, #a78bfa, #6d28d9); --sh: rgba(109,40,217,0.5); }
.t-pink { background: linear-gradient(160deg, #fb7185, #e11d48); --sh: rgba(225,29,72,0.5); }
.t-teal { background: linear-gradient(160deg, #2dd4bf, #0d9488); --sh: rgba(13,148,136,0.5); }
.t-blue { background: linear-gradient(160deg, #60a5fa, #2563eb); --sh: rgba(37,99,235,0.5); }
.t-slate { background: linear-gradient(160deg, #94a3b8, #475569); --sh: rgba(71,85,105,0.45); }
.t-green { background: linear-gradient(160deg, #34d399, #059669); --sh: rgba(5,150,105,0.45); }

.lg-tile svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.lg-btn > svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* Dark variant of Liquid Glass toolbar */
.lg-toolbar.dark {
  background: rgba(24, 27, 40, 0.78);
  box-shadow: var(--reflex-dark);
}
.lg-toolbar.dark .lg-btn {
  background: rgba(255, 255, 255, 0.11);
  color: #f4f6fb;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 2px 6px rgba(0,0,0,0.3);
}

/* ─── 0. STORE ICON (128x128) ────────────────────────────────────────────── */
.tpl-icon {
  width: 128px;
  height: 128px;
  display: grid;
  place-items: center;
  background: transparent;
}
.tpl-icon img {
  width: 96px;
  height: 96px;
  display: block;
  filter: drop-shadow(0 6px 10px rgba(17, 19, 26, 0.22));
}

/* ─── 1. SMALL PROMO TILE (440x280) ──────────────────────────────────────── */
.tpl-small {
  width: 440px;
  height: 280px;
  position: relative;
  overflow: hidden;
}
.tpl-small .optical-ribbon {
  inset: -14px -18px -20px -10px;
  width: 470px;
  height: 320px;
  opacity: 0.42;
}
.tpl-small .content {
  position: relative;
  z-index: 2;
  padding: 26px 26px 0;
}
.tpl-small .brand {
  display: flex;
  align-items: center;
  gap: 11px;
}
.tpl-small .brand img {
  width: 38px;
  height: 38px;
  filter: drop-shadow(0 6px 12px rgba(244, 63, 94, 0.20));
}
.tpl-small .brand-name {
  font-family: var(--display);
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.04em;
  color: var(--ink);
}
.tpl-small .headline {
  margin-top: 14px;
  font-family: var(--display);
  font-size: 27px;
  font-weight: 800;
  line-height: 1.09;
  letter-spacing: -0.035em;
  color: var(--ink);
  max-width: 310px;
}
.tpl-small .reticle {
  position: absolute;
  right: 22px;
  top: 24px;
  width: 82px;
  height: 62px;
  border: 1.5px solid rgba(17, 19, 26, 0.22);
  border-radius: 10px;
  background: rgba(255,255,255,0.45);
  backdrop-filter: blur(8px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  z-index: 2;
}
.tpl-small .reticle span {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  color: var(--ink);
}
.tpl-small .reticle small {
  font-size: 9px;
  color: var(--ink-2);
  font-weight: 600;
}
.tpl-small .pill-dock {
  position: absolute;
  left: 16px;
  bottom: 18px;
  z-index: 3;
  transform: scale(0.84);
  transform-origin: left bottom;
}

/* ─── 2. MARQUEE PROMO TILE (1400x560) ───────────────────────────────────── */
.tpl-marquee {
  width: 1400px;
  height: 560px;
  position: relative;
  overflow: hidden;
}
.tpl-marquee .optical-ribbon {
  left: -80px;
  top: -30px;
  width: 960px;
  height: 640px;
  opacity: 0.48;
  mask-image: linear-gradient(95deg, #000 35%, transparent 92%);
  -webkit-mask-image: linear-gradient(95deg, #000 35%, transparent 92%);
}
.tpl-marquee .left {
  position: absolute;
  left: 68px;
  top: 0;
  bottom: 0;
  width: 520px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  z-index: 4;
}
.tpl-marquee .brand-row {
  display: flex;
  align-items: center;
  gap: 14px;
}
.tpl-marquee .brand-row img {
  width: 52px;
  height: 52px;
  filter: drop-shadow(0 8px 18px rgba(17, 19, 26, 0.16));
}
.tpl-marquee .brand-title {
  font-family: var(--display);
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.04em;
  color: var(--ink);
}
.tpl-marquee .brand-meta {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-2);
  margin-top: 2px;
}
.tpl-marquee h1 {
  margin-top: 26px;
  font-size: 54px;
  line-height: 1.03;
  letter-spacing: -0.042em;
  color: var(--ink);
}
.tpl-marquee .cap-line {
  margin-top: 24px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink-2);
}
.tpl-marquee .cap-line .dot { color: rgba(17, 19, 26, 0.28); font-weight: 400; }
.tpl-marquee .meta-foot {
  margin-top: 28px;
  padding-top: 18px;
  border-top: 1px solid rgba(17, 19, 26, 0.09);
  display: flex;
  align-items: center;
  gap: 18px;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--ink-2);
}
.tpl-marquee .meta-foot strong { color: var(--ink); font-weight: 700; }

.tpl-marquee .stage-right {
  position: absolute;
  right: -26px;
  top: 40px;
  width: 780px;
  height: 500px;
  z-index: 3;
}
.tpl-marquee .main-win {
  position: absolute;
  left: 172px;
  top: 0;
  width: 632px;
  height: 492px;
}
.tpl-marquee .win-body {
  position: relative;
  height: calc(100% - 38px);
  background: #fbfaf7;
  padding: 24px 28px 28px 84px;
  overflow: hidden;
}
.tpl-marquee .site-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: #6b7280;
  font-weight: 500;
  margin-bottom: 54px;
}
.tpl-marquee .site-logo { font-family: var(--display); font-weight: 800; color: #161822; font-size: 14px; letter-spacing: -0.02em; }
.tpl-marquee .site-grid {
  display: block;
}
.tpl-marquee .photo-sel {
  position: relative;
  border-radius: 14px;
  overflow: visible;
  width: 472px;
}
.tpl-marquee .photo-sel img {
  width: 100%;
  height: 274px;
  object-fit: cover;
  border-radius: 14px;
  display: block;
}
.tpl-marquee .sel-outline {
  position: absolute;
  inset: -7px;
  border: 2px solid #11131a;
  border-radius: 18px;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.85), 0 16px 36px -12px rgba(17,19,26,0.28);
}
.tpl-marquee .sel-dim {
  position: absolute;
  top: -34px;
  left: 0;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  color: #11131a;
  background: rgba(255,255,255,0.92);
  padding: 4px 10px;
  border-radius: 999px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.12), inset 0 0 0 1px rgba(17,19,26,0.08);
}
.tpl-marquee .marquee-toolbar {
  position: absolute;
  right: 22px;
  top: 48px;
  z-index: 6;
  transform: scale(0.84);
  transform-origin: top right;
}
.tpl-marquee .popup-float {
  position: absolute;
  left: 0;
  top: 72px;
  width: 234px;
  border-radius: 22px;
  overflow: hidden;
  z-index: 7;
  box-shadow:
    0 0 0 1px rgba(17, 19, 26, 0.10),
    0 34px 68px -16px rgba(15, 23, 42, 0.34);
}
.tpl-marquee .popup-float img { width: 100%; display: block; }

.tpl-marquee .saving-toast {
  position: absolute;
  right: 54px;
  bottom: 22px;
  z-index: 8;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(22px) saturate(180%);
  box-shadow: var(--reflex-light);
}
.tpl-marquee .saving-toast .txt b { display: block; font-size: 13px; color: #11131a; font-weight: 700; }
.tpl-marquee .saving-toast .txt span { font-family: var(--mono); font-size: 11.5px; color: #059669; font-weight: 600; }

/* ─── 3. SCREENSHOT 1: INSTANT REGION & FULL-PAGE CAPTURE (1280x800) ─────── */
.tpl-shot1 {
  width: 1280px;
  height: 800px;
  position: relative;
  display: grid;
  grid-template-columns: 416px 1fr;
}
.tpl-shot1 .optical-ribbon {
  left: -120px;
  bottom: -80px;
  width: 680px;
  height: 460px;
  opacity: 0.40;
}
.tpl-shot1 .rail {
  position: relative;
  z-index: 3;
  padding: 64px 36px 56px 64px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.tpl-shot1 h1 {
  margin-top: 22px;
  font-size: 48px;
  line-height: 1.04;
}
.tpl-shot1 .lead { margin-top: 20px; max-width: 310px; }
.tpl-shot1 .spec-list {
  margin-top: 32px;
  border-top: 1px solid rgba(17, 19, 26, 0.09);
  padding-top: 22px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}
.tpl-shot1 .spec-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  font-size: 13.5px;
}
.tpl-shot1 .spec-row span { color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.tpl-shot1 .spec-row b { color: var(--ink); font-weight: 700; font-size: 13px; white-space: nowrap; }
.tpl-shot1 .privacy-note {
  font-size: 12.5px;
  color: var(--ink-3);
  font-weight: 500;
}

.tpl-shot1 .canvas-stage {
  position: relative;
  padding: 42px 0 0 18px;
  z-index: 2;
}
.tpl-shot1 .browser-bleed {
  width: 896px;
  height: 758px;
  border-radius: 20px 0 0 0;
}
.tpl-shot1 .editorial-page {
  position: relative;
  height: calc(100% - 38px);
  background: #faf8f4;
  padding: 36px 46px;
  overflow: hidden;
}
.tpl-shot1 .ed-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 24px;
  border-bottom: 1px solid rgba(17,19,26,0.08);
}
.tpl-shot1 .ed-brand { font-family: var(--display); font-weight: 800; font-size: 17px; letter-spacing: -0.03em; color: #161822; }
.tpl-shot1 .ed-links { display: flex; gap: 24px; font-size: 13px; color: #5c6272; font-weight: 500; }
.tpl-shot1 .ed-hero {
  margin-top: 66px;
  display: grid;
  grid-template-columns: 300px 422px;
  gap: 36px;
  align-items: start;
}
.tpl-shot1 .ed-issue { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #0f766e; font-weight: 600; }
.tpl-shot1 .ed-h2 { margin-top: 14px; font-family: var(--display); font-size: 38px; line-height: 1.08; letter-spacing: -0.04em; font-weight: 800; color: #151722; }
.tpl-shot1 .ed-p { margin-top: 16px; font-size: 14.5px; line-height: 1.62; color: #545968; }

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwiftSelect</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,100..1000&display=swap"
    />
    <style>
      :root {
        --font-stack: "Google Sans", "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
        --c-glass: #bbbbbc;
        --c-light: #fff;
        --c-dark: #000;
        --c-content: #e1e1e1;
        --c-action: #03d5ff;
        --c-bg: #1b1b1d;
        --glass-reflex-dark: 1;
        --glass-reflex-light: 1;
        --saturation: 150%;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 360px;
        min-width: 360px;
        background: transparent;
        color: var(--c-content, #e1e1e1);
        font-family: var(--font-stack);
        font-size: 13.5px;
        overflow: hidden;
        user-select: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      @media (min-width: 380px) {
        html, body {
          width: 100%;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #0f0f14;
        }
        .qs-notice-card {
          width: 360px;
          margin: auto;
          box-shadow: 0 20px 48px rgba(0, 0, 0, 0.7);
        }
      }

      /* Seamless Liquid Glass Container matching main menu tooltip */
      .qs-notice-card {
        position: relative;
        box-sizing: border-box;
        width: 100%;
        min-height: 100%;
        padding: 16px 18px 14px 18px;
        border-radius: 0;
        border: none;
        display: flex;
        flex-direction: column;
        overflow: hidden;

        /* Unified Liquid Glass dark background matching tooltip */
        background-color: color-mix(in srgb, var(--c-glass, #bbbbbc) 14%, rgba(18, 18, 22, 0.96));
        backdrop-filter: blur(20px) saturate(var(--saturation, 160%));
        -webkit-backdrop-filter: blur(20px) saturate(var(--saturation, 160%));
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.12),
          inset 1px 1.5px 0px -1px rgba(255, 255, 255, 0.75),
          inset -1px -1px 0px -1px rgba(0, 0, 0, 0.25),
          0px 8px 24px rgba(0, 0, 0, 0.55);
      }

      /* Subtle Ambient Glow */
      .qs-notice-glow {
        position: absolute;
        top: -30px;
        left: -30px;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        pointer-events: none;
        opacity: 0.25;
        filter: blur(36px);
        z-index: 0;
      }
      .qs-notice-glow.warning {
        background: rgba(186, 75, 92, 0.5);
      }
      .qs-notice-glow.file {
        background: rgba(245, 158, 11, 0.5);
      }
      .qs-notice-glow.settings {
        background: rgba(3, 213, 255, 0.4);
      }
      .qs-notice-glow.help {
        background: rgba(139, 92, 246, 0.4);
      }

      /* Header Row matching tooltip header */
      .qs-notice-header {
        display: flex;
        align-items: center;
        gap: 8px;
        position: relative;
        z-index: 1;
        margin-bottom: 2px;
      }

      .qs-notice-icon-wrapper {
        width: 28px;
        height: 28px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .qs-notice-icon-wrapper.warning {
        background: rgba(186, 75, 92, 0.2);
        color: #e26d7f;
        border: 1px solid rgba(186, 75, 92, 0.4);
      }

      .qs-notice-icon-wrapper.file {
        background: rgba(245, 158, 11, 0.2);
        color: #F59E0B;
        border: 1px solid rgba(245, 158, 11, 0.4);
      }

      .qs-notice-icon-wrapper.settings {
        background: rgba(3, 213, 255, 0.18);
        color: #03d5ff;
        border: 1px solid rgba(3, 213, 255, 0.35);
      }

      .qs-notice-icon-wrapper.help {
        background: rgba(139, 92, 246, 0.18);
        color: #A78BFA;
        border: 1px solid rgba(139, 92, 246, 0.35);
      }

      .qs-notice-badge {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.3px;
        padding: 3px 8px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: rgba(255, 255, 255, 0.9);
        line-height: 1.2;
      }

      .qs-notice-close {
        margin-left: auto;
        width: 26px;
        height: 26px;
        border-radius: 4px;
        border: none;
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.65);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s ease;
        padding: 0;
      }
      .qs-notice-close:hover {
        background: rgba(255, 255, 255, 0.16);
        color: #ffffff;
      }

      /* Notice Content matching tooltip typography */
      .qs-notice-body {
        position: relative;
        z-index: 1;
        text-align: left;
      }

      .qs-notice-title {
        font-size: 14.5px;
        font-weight: 700;
        letter-spacing: -0.25px;
        margin: 8px 0 3px 0;
        color: #ffffff;
        line-height: 1.35;
      }

      .qs-notice-desc {
        font-size: 12.5px;
        line-height: 1.48;
        color: rgba(255, 255, 255, 0.78);
        margin: 0 0 12px 0;
      }

      /* Tip Card matching clean structured tooltip container */
      .qs-notice-tip {
        position: relative;
        z-index: 1;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        padding: 8px 12px;
        font-size: 12px;
        line-height: 1.45;
        display: flex;
        align-items: flex-start;
        gap: 8px;
        text-align: left;
        color: rgba(255, 255, 255, 0.78);
        margin-bottom: 12px;
        box-sizing: border-box;
      }

      .qs-tip-icon {
        flex-shrink: 0;
        color: #03d5ff;
        font-size: 13px;
        line-height: 1.3;
      }

      /* Quick Preferences Panel with crisp 4px corners */
      .qs-quick-prefs {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.32);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25);
        margin-bottom: 12px;
      }

      .qs-pref-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .qs-pref-label {
        font-size: 11.5px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.78);
      }

      .qs-segmented-toggle {
        display: flex;
        padding: 2px;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        gap: 2px;
      }

      .qs-toggle-btn {
        all: initial;
        font-family: inherit;
        font-size: 11px;
        font-weight: 600;
        padding: 4px 8px;
        border-radius: 3px;
        cursor: pointer;
        color: rgba(255, 255, 255, 0.65);
        transition: all 0.15s ease;
        text-align: center;
        white-space: nowrap !important;
        flex: 1;
      }
      .qs-toggle-btn.active {
        background: #ffffff;
        color: #121216;
        font-weight: 700;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      }
      .qs-toggle-btn:hover:not(.active) {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.08);
      }

      /* Keyboard Shortcuts Panel */
      .qs-shortcuts-list {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px 12px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.32);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25);
        margin-bottom: 12px;
      }

      .qs-shortcut-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11.5px;
        color: rgba(255, 255, 255, 0.82);
      }

      .qs-kbd {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        font-size: 10.5px;
        font-weight: 700;
        padding: 2.5px 7px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: #ffffff;
        line-height: 1.1;
      }

      /* Action Button - Liquid Glass with crisp 4px corners */
      .qs-notice-btn {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        height: 36px;
        padding: 0 14px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        font-size: 12.5px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        box-sizing: border-box;
        background-color: color-mix(in srgb, var(--c-glass, #bbbbbc) 30%, transparent);
        color: #ffffff;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.35),
          0px 2px 6px rgba(0, 0, 0, 0.3);
        transition: transform 140ms ease, background-color 150ms ease;
      }
      .qs-notice-btn:hover {
        background-color: color-mix(in srgb, var(--c-glass, #bbbbbc) 45%, transparent);
        transform: translateY(-1px);
      }
      .qs-notice-btn:active {
        transform: scale(0.98);
      }

      /* Quick Sub Action Buttons with crisp 4px corners */
      .qs-quick-actions-row {
        position: relative;
        z-index: 1;
        display: flex;
        gap: 8px;
        margin-top: 6px;
        width: 100%;
      }
      .qs-notice-sub-btn {
        all: initial;
        font-family: inherit;
        font-size: 11.5px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.85);
        background-color: color-mix(in srgb, var(--c-glass, #bbbbbc) 22%, transparent);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        height: 32px;
        padding: 0 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        flex: 1;
        cursor: pointer;
        box-sizing: border-box;
        transition: transform 140ms ease, background-color 150ms ease, color 150ms ease;
      }
      .qs-notice-sub-btn:hover {
        background-color: color-mix(in srgb, var(--c-glass, #bbbbbc) 36%, transparent);
        color: #ffffff;
        transform: translateY(-1px);
      }
      .qs-notice-sub-btn:active {
        transform: scale(0.98);
      }

      /* Footer Hint */
      .qs-notice-footer {
        position: relative;
        z-index: 1;
        margin-top: 10px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.55);
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }
      .qs-notice-footer kbd {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        font-size: 10px;
        font-weight: 700;
        padding: 2px 5px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: #ffffff;
        line-height: 1;
      }
    </style>
  </head>
  <body class="notice-mode">
    <div id="notice-view" class="qs-notice-card">
      <div class="qs-notice-glow" id="notice-glow"></div>
      <div class="qs-notice-header">
        <div class="qs-notice-icon-wrapper" id="notice-icon"></div>
        <span class="qs-notice-badge" id="notice-badge">Preferences</span>
        <button class="qs-notice-close" id="notice-close-btn" title="Close (Esc)" aria-label="Close">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </div>

      <div class="qs-notice-body">
        <div class="qs-notice-title" id="notice-title">Notice</div>
        <div class="qs-notice-desc" id="notice-desc">Description</div>
      </div>

      <div class="qs-notice-tip" id="notice-tip">
        <span class="qs-tip-icon">✦</span>
        <span class="qs-tip-text" id="notice-tip-text">SwiftSelect works on all normal websites and web apps.</span>
      </div>

      <!-- Quick Preferences Toggle -->
      <div class="qs-quick-prefs" id="notice-prefs">
        <div class="qs-pref-row">
          <span class="qs-pref-label">Export Format</span>
          <div class="qs-segmented-toggle" id="pref-format-toggle">
            <button class="qs-toggle-btn active" data-format="jpg">JPG (Small)</button>
            <button class="qs-toggle-btn" data-format="png">PNG (Lossless)</button>
          </div>
        </div>
        <div class="qs-pref-row">
          <span class="qs-pref-label">Destination</span>
          <div class="qs-segmented-toggle" id="pref-dest-toggle">
            <button class="qs-toggle-btn active" data-dest="both">Both</button>
            <button class="qs-toggle-btn" data-dest="clipboard">Copy</button>
            <button class="qs-toggle-btn" data-dest="download">Save</button>
          </div>
        </div>
        <div class="qs-pref-row">
          <span class="qs-pref-label">Theme</span>
          <div class="qs-segmented-toggle" id="pref-theme-toggle">
            <button class="qs-toggle-btn active" data-theme="glass">Glass</button>
            <button class="qs-toggle-btn" data-theme="standard">Standard</button>
            <button class="qs-toggle-btn" data-theme="dark">Dark</button>
            <button class="qs-toggle-btn" data-theme="light">Light</button>
          </div>
        </div>
      </div>

      <!-- Shortcuts List -->
      <div class="qs-shortcuts-list" id="notice-shortcuts" style="display: none;">
        <div class="qs-shortcut-row">
          <span>Select Area</span>
          <kbd class="qs-kbd" id="sc-select">Alt + X</kbd>
        </div>
        <div class="qs-shortcut-row">
          <span>Visible Area</span>
          <kbd class="qs-kbd" id="sc-visible">Alt + S</kbd>
        </div>
        <div class="qs-shortcut-row">
          <span>Delayed Capture (3s)</span>
          <kbd class="qs-kbd" id="sc-timer">Alt + T</kbd>
        </div>
        <div class="qs-shortcut-row">
          <span>Horizontal View</span>
          <kbd class="qs-kbd" id="sc-horizontal">Alt + H</kbd>
        </div>
        <div class="qs-shortcut-row">
          <span>Full Page</span>
          <kbd class="qs-kbd" id="sc-full">Alt + F</kbd>
        </div>
      </div>

      <button class="qs-notice-btn" id="notice-action-btn" style="display: none;">
        <span id="notice-action-text">Action</span>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
          <path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-8.29-1.42 1.42L16.86 11H5v2z"/>
        </svg>
      </button>

      <div class="qs-quick-actions-row" id="notice-quick-actions" style="display: none;">
        <button class="qs-notice-sub-btn" id="btn-quick-visible" title="Capture Visible Area (Alt+S)">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <span>Visible Area</span>
        </button>
        <button class="qs-notice-sub-btn" id="btn-quick-full" title="Capture Full Page (Alt+F)">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
          <span>Full Page</span>
        </button>
      </div>

      <div class="qs-notice-footer">
        <span id="notice-footer-text">Press <kbd>Alt</kbd>+<kbd>X</kbd> on any webpage</span>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>

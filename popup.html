<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SwiftSelect</title>
    <script src="src/pageTheme.js"></script>
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body class="popup">
    <div class="popup-shell">
      <header class="popup-head">
        <span class="logo" aria-hidden="true"><img src="icons/icon128.png" alt="" /></span>
        <b>SwiftSelect</b>
        <button type="button" class="btn btn-quiet popup-tool" id="open-convert" title="Batch image converter"><i data-icon="convert"></i>Convert</button>
      </header>

      <section class="notice" id="notice" role="alert" hidden>
        <div class="notice-top">
          <span class="notice-glyph" id="notice-glyph"></span>
          <div>
            <h1 class="notice-title" id="notice-title"></h1>
            <p class="notice-sub" id="notice-sub"></p>
          </div>
        </div>
        <p class="notice-body" id="notice-body"></p>
        <div class="notice-actions" id="notice-actions"></div>
      </section>

      <nav class="actions glass" id="actions" aria-label="Capture">
        <button type="button" class="action" data-tone="blue" data-mode="region" data-command="activate-selection" style="--i: 0">
          <span class="action-glyph"><i data-icon="region"></i></span>
          <span class="action-text">Capture Region</span>
          <span class="action-keys"></span>
        </button>
        <button type="button" class="action" data-tone="cyan" data-mode="visible" data-command="capture-visible-download" style="--i: 1">
          <span class="action-glyph"><i data-icon="visible"></i></span>
          <span class="action-text">Capture Visible</span>
          <span class="action-keys"></span>
        </button>
        <button type="button" class="action" data-tone="violet" data-mode="full" data-command="capture-full-page" style="--i: 2">
          <span class="action-glyph"><i data-icon="fullpage"></i></span>
          <span class="action-text">Capture Full Page</span>
          <span class="action-keys"></span>
        </button>
        <div class="divider"></div>
        <button type="button" class="action" data-tone="amber" data-mode="horizontal" data-command="capture-horizontal" style="--i: 3">
          <span class="action-glyph"><i data-icon="horizontal"></i></span>
          <span class="action-text">Capture Horizontal</span>
          <span class="action-keys"></span>
        </button>
        <button type="button" class="action" data-tone="pink" data-mode="timer" data-command="capture-timer" style="--i: 4">
          <span class="action-glyph"><i data-icon="timer"></i></span>
          <span class="action-text" id="timer-label">Delayed Capture</span>
          <span class="action-keys"></span>
        </button>
        <div class="divider"></div>
        <button type="button" class="action" data-tone="teal" data-mode="annotate" style="--i: 5">
          <span class="action-glyph"><i data-icon="annotated"></i></span>
          <span class="action-text">Annotate Page</span>
          <span class="action-keys"></span>
        </button>
      </nav>

      <section class="recent glass" id="recent" hidden>
        <div class="recent-head">
          <span>Recent · click to copy</span>
          <button type="button" id="recent-all">View all</button>
        </div>
        <div class="recent-grid" id="recent-grid"></div>
      </section>

      <footer class="popup-foot">
        <button type="button" class="btn" id="open-gallery">
          <i data-icon="gallery"></i>Gallery<b class="nav-count" id="gallery-count" hidden></b>
        </button>
        <button type="button" class="btn" id="open-settings"><i data-icon="settings"></i>Settings</button>
      </footer>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
